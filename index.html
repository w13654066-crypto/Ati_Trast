<html lang="fa" dir="rtl">

<title>Ati_Trust | فروشگاه زیبایی</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:tahoma;background:#fff5f9;color:#702044}
header{background:linear-gradient(135deg,#f6a5c0,#d63384);color:white;text-align:center;padding:30px 15px}

#cart{background:white;border-radius:15px;padding:15px;margin:25px auto;max-width:500px}
input{padding:12px;border:1px solid pink;border-radius:8px;margin:5px;width:90%}
footer{background:#f6a5c0;color:white;text-align:center;padding:20px;margin-top:30px}
</style>
</head>

</main>
<footer>🩷 Ati_Trust | همراه زیبایی شما</footer>
